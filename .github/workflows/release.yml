name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re, tomllib
          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              tag = os.environ["RELEASE_TAG"]
              assert re.fullmatch(r"v\d+\.\d+\.\d+", tag), "Expected a stable version tag"
              assert tag == "v" + manifest["package"]["version"], "Tag must match Cargo.toml"
          PY
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          rustup default 1.96.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check frontend and build embedded assets
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run typecheck
          npm --prefix frontend test
          npm --prefix frontend run build
      - name: Check Rust
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Check development launcher
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/opencode
          mkdir -p /tmp/opencode
          cargo install --locked --version 2.8.0 watchexec-cli
          node --test tests/dev*.test.mjs
      - name: Check release installer
        if: runner.os == 'Linux'
        run: PYTHONDONTWRITEBYTECODE=1 python -W error -m unittest discover -s scripts/tests
      - name: Install cargo-dist
        if: runner.os != 'Windows'
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh -o "$RUNNER_TEMP/install-dist.sh"
          sh "$RUNNER_TEMP/install-dist.sh"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install cargo-dist on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.ps1 -OutFile "$env:RUNNER_TEMP/install-dist.ps1"
          & "$env:RUNNER_TEMP/install-dist.ps1"
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build native distribution
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          tag_args=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then tag_args+=(--tag="$RELEASE_TAG"); fi
          dist build --artifacts=local --target="$TARGET" "${tag_args[@]}" --output-format=json > local-dist-manifest.json
          cp local-dist-manifest.json "target/distrib/$TARGET-dist-manifest.json"
      - name: Verify archive and installed executable
        env:
          LAIN_TEST_CHART_EXPORT: "1"
        run: node scripts/verify-release.mjs "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          retention-days: 1
          if-no-files-found: error
          path: |
            target/distrib/lain-${{ matrix.target }}.*
            target/distrib/${{ matrix.target }}-dist-manifest.json

  installers:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: target/distrib
          merge-multiple: true
      - name: Install Rust and cargo-dist
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh -o "$RUNNER_TEMP/install-dist.sh"
          sh "$RUNNER_TEMP/install-dist.sh"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build and prepare universal installers
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag_args=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then tag_args+=(--tag="$RELEASE_TAG"); fi
          dist build --artifacts=global "${tag_args[@]}"
          python3 scripts/prepare_installer.py target/distrib/lain-installer.sh
          python3 scripts/prepare_installer.py target/distrib/lain-installer.ps1
          cd target/distrib
          sha256sum lain-*.tar.xz lain-*.zip lain-installer.sh lain-installer.ps1 > sha256.sum
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          retention-days: 1
          if-no-files-found: error
          path: |
            target/distrib/lain-*.tar.xz
            target/distrib/lain-*.zip
            target/distrib/lain-*.sha256
            target/distrib/lain-installer.sh
            target/distrib/lain-installer.ps1
            target/distrib/sha256.sum

  installer-smoke:
    needs: installers
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: target/distrib
      - name: Verify native release installer with isolated state
        run: node tests/release-installer-smoke.mjs

  publish:
    needs: [build, installers, installer-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: target/distrib
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" target/distrib/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
