name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, tomllib
          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              tag = os.environ["RELEASE_TAG"]
              assert re.fullmatch(r"v\d+\.\d+\.\d+", tag), "Expected a stable version tag"
              assert tag == "v" + manifest["package"]["version"], "Tag must match Cargo.toml"
          PY
      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt
          rustup default 1.96.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check frontend and build embedded assets
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run typecheck
          npm --prefix frontend test
          npm --prefix frontend run build
      - name: Check Rust
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Check development launcher
        run: |
          mkdir -p /tmp/opencode
          node --test tests/dev-start.test.mjs
      - name: Check release installer
        run: PYTHONDONTWRITEBYTECODE=1 python3 -W error -m unittest discover -s scripts/tests
      - name: Install cargo-dist
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh -o "$RUNNER_TEMP/install-dist.sh"
          sh "$RUNNER_TEMP/install-dist.sh"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build distribution
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: dist build --artifacts=all --target=x86_64-unknown-linux-gnu --tag="$RELEASE_TAG"
      - name: Add automatic user service setup to installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/prepare_installer.py target/distrib/lain-installer.sh
      - name: Verify archive and installed executable
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd target/distrib
          sha256sum --check lain-x86_64-unknown-linux-gnu.tar.xz.sha256
          mkdir smoke
          tar -xJf lain-x86_64-unknown-linux-gnu.tar.xz -C smoke
          cd ../..
          node tests/release-smoke.mjs target/distrib/smoke/lain-x86_64-unknown-linux-gnu/lain
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" target/distrib/lain-x86_64-unknown-linux-gnu.tar.xz target/distrib/lain-x86_64-unknown-linux-gnu.tar.xz.sha256 target/distrib/lain-installer.sh --clobber
          gh release edit "$RELEASE_TAG" --draft=false
